baseURL = 'https://xiaoheizi112.github.io/'
title = '慢公子的小站'
locale = 'zh-CN'
defaultContentLanguage = 'zh-cn'
hasCJKLanguage = true
enableEmoji = true
enableRobotsTXT = true
theme = 'PaperMod'

# 只用标签，不用分类（避免 sitemap 里出现空的 /categories/）
[taxonomies]
tag = 'tags'

# 站内搜索（PaperMod 内置 fastsearch）：首页额外产出 index.json 供前端检索
[outputs]
home = ['HTML', 'RSS', 'JSON']

[pagination]
pagerSize = 8

[params]
env = 'production'
dateFormat = '2006年1月2日'
description = '一个很懒的人的博客,想起来才更新。'
author = '慢公子'
defaultTheme = 'auto'
ShowReadingTime = true
ShowWordCount = true
ShowBreadCrumbs = true
ShowPostNavLinks = true
ShowCodeCopyButtons = true
ShowShareButtons = false
ShowToc = true
TocOpen = false

# 全站兜底 OG 图：文章用各自 frontmatter 的 images 参数（scripts/gen_og_cards.py 生成），
# 其余页面（列表/标签/归档等）回退到这张
images = ["images/og-cover.png"]

# 文章评论（giscus，GitHub Discussions 驱动）。启用步骤见 layouts/_partials/comments.html 头注释：
#   1. 仓库 Settings → Features 勾选 Discussions
#   2. 装 giscus app，去 giscus.app 选仓库/类别，生成 repo-id 与 category-id
#   3. 填下面字段并把 enable 改成 true
[params.giscus]
enable = false
repo = "xiaoheizi112/xiaoheizi112.github.io"
repoId = ""
category = "Announcements"
categoryId = ""
mapping = "pathname"

[params.assets]
favicon = "favicon.svg"

[params.homeInfoParams]
Title = '慢公子的小站'
Content = '一个很懒的人的博客。更新频率取决于我什么时候突然想说点什么。'

[[params.socialIcons]]
name = 'github'
url = 'https://github.com/xiaoheizi112'

[menu]
[[menu.main]]
identifier = 'posts'
name = '文章'
url = '/posts/'
weight = 10
[[menu.main]]
identifier = 'tracks'
name = '路线'
url = '/tracks/'
weight = 12
[[menu.main]]
identifier = 'archives'
name = '归档'
url = '/archives/'
weight = 15
[[menu.main]]
identifier = 'tags'
name = '标签'
url = '/tags/'
weight = 20
[[menu.main]]
identifier = 'search'
name = '搜索'
url = '/search/'
weight = 22
[[menu.main]]
identifier = 'photos'
name = '相册'
url = '/photos/'
weight = 25
[[menu.main]]
identifier = 'about'
name = '关于'
url = '/about/'
weight = 30
[[menu.main]]
identifier = 'now'
name = '现在'
url = '/now/'
weight = 35

[markup]
[markup.highlight]
codeFences = true
guessSyntax = true
lineNos = false
style = 'monokai'
[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
startLevel = 2
endLevel = 4
ordered = false
