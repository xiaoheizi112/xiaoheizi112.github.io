baseURL = 'https://xiaoheizi112.github.io/'
title = '慢公子的小站'
locale = 'zh-CN'
defaultContentLanguage = 'zh-cn'
hasCJKLanguage = true
enableEmoji = true
enableRobotsTXT = true
theme = 'PaperMod'

[pagination]
pagerSize = 8

[params]
env = 'production'
description = '一个很懒的人的博客,想起来才更新。'
author = '慢公子'
defaultTheme = 'auto'
ShowReadingTime = true
ShowWordCount = true
ShowBreadCrumbs = true
ShowPostNavLinks = true
ShowCodeCopyButtons = true
ShowShareButtons = false
ShowToc = true
TocOpen = false

[params.homeInfoParams]
Title = '慢公子的小站'
Content = '一个很懒的人的博客。更新频率取决于我什么时候突然想说点什么。'

[[params.socialIcons]]
name = 'github'
url = 'https://github.com/xiaoheizi112'

[menu]
[[menu.main]]
identifier = 'posts'
name = '文章'
url = '/posts/'
weight = 10
[[menu.main]]
identifier = 'tags'
name = '标签'
url = '/tags/'
weight = 20
[[menu.main]]
identifier = 'about'
name = '关于'
url = '/about/'
weight = 30

[markup]
[markup.highlight]
codeFences = true
guessSyntax = true
lineNos = false
style = 'monokai'
[markup.goldmark.renderer]
unsafe = true
