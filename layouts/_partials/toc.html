{{- /* 覆盖 themes/PaperMod/layouts/_partials/toc.html：侧栏 sticky 目录（≥1100px），移动端隐藏 */ -}}
{{- $toc := .TableOfContents | string -}}
{{- if findRE "<li" $toc -}}
<aside class="post-toc" id="post-toc" aria-label="目录">
    <div class="post-toc-title">目录</div>
    {{- $toc | safeHTML -}}
</aside>
<script>
(function () {
    function tocInit() {
        if (window.__tocSpy) { window.__tocSpy.disconnect(); window.__tocSpy = null; }
        var toc = document.getElementById('post-toc');
        if (!toc || !toc.clientWidth) return; // 移动端 display:none 时不跑（别用 offsetParent：fixed 定位下恒为 null）
        var links = Array.prototype.slice.call(toc.querySelectorAll('a[href^="#"]'));
        var map = {};
        links.forEach(function (a) {
            var t = document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
            if (t) map[t.id] = a;
        });
        var targets = Object.keys(map).map(function (id) { return document.getElementById(id); });
        if (!targets.length) return;
        var setActive = function (a) {
            toc.querySelectorAll('.active').forEach(function (el) { el.classList.remove('active'); });
            if (a) a.classList.add('active');
        };
        // 自己接管点击：Turbo 对"同一个锚点第二次点击"（hash 不变）不响应，必须手动 scrollIntoView。
        // 滚动全程交给浏览器原生动画，不中途抢方向盘；只在"停稳"后测一次，偏差大才轻补一段（最多 2 次）。
        // 用户滚轮/触摸一动立即交还控制权；已到页底滚不动了就认了，不空转。
        var TOP = 84, act = null;
        function arm() {
            if (!act) return;
            clearTimeout(act.timer);
            act.timer = setTimeout(function () {
                var d = act.t.getBoundingClientRect().top - TOP;
                var maxS = document.documentElement.scrollHeight - innerHeight;
                if (Math.abs(d) < 8 || act.fixes >= 2 || (d > 0 && scrollY >= maxS - 2)) { act = null; return; }
                act.fixes++;
                scrollTo({ top: scrollY + d, behavior: 'smooth' });
                arm();
            }, 250);
        }
        function bail() { if (act) { clearTimeout(act.timer); act = null; } }
        function goTo(t) {
            bail();
            act = { t: t, fixes: 0 };
            t.scrollIntoView({ behavior: 'smooth' });
            arm();
        }
        addEventListener('scroll', function () { if (act) arm(); }, { passive: true });
        addEventListener('wheel', bail, { passive: true });
        addEventListener('touchstart', bail, { passive: true });
        toc.addEventListener('click', function (e) {
            var a = e.target.closest('a[href^="#"]');
            if (!a) return;
            var t = document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
            if (!t) return;
            e.preventDefault();
            goTo(t);
            history.replaceState(null, '', a.getAttribute('href'));
            setActive(a);
        });
        var spy = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) { if (en.isIntersecting) setActive(map[en.target.id]); });
        }, { rootMargin: '10% 0px -70% 0px' });
        targets.forEach(function (t) { spy.observe(t); });
        setActive(links[0]);
        window.__tocSpy = spy;
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', tocInit);
    else tocInit();
    document.addEventListener('turbo:load', tocInit);
})();
</script>
{{- end -}}
