{{- /* 覆盖 themes/PaperMod/layouts/_partials/toc.html：桌面侧栏 sticky 目录（≥1100px）
       + 移动端顶部可折叠目录（<1100px），两套共用同一份滚动高亮脚本。 */ -}}
{{- $toc := .TableOfContents | string -}}
{{- if findRE "<li" $toc -}}
<aside class="post-toc" id="post-toc" aria-label="目录">
    <div class="post-toc-title">目录</div>
    {{- $toc | safeHTML -}}
</aside>
<details class="post-toc-mobile">
    <summary>目录<span class="post-toc-mobile-count">{{ len (findRE "<li" $toc) }} 节</span></summary>
    <div class="post-toc-mobile-body">{{ $toc | safeHTML }}</div>
</details>
<script>
(function () {
    function tocInit() {
        if (window.__tocSpy) { window.__tocSpy.disconnect(); window.__tocSpy = null; }
        // 两套目录容器：桌面 aside 与移动 details。按可见性各取其一（另一套被 CSS 隐藏）
        var boxes = [document.querySelector('.post-toc'), document.querySelector('.post-toc-mobile')]
            .filter(function (el) { return el && el.clientWidth; });
        if (!boxes.length) return;
        var map = {}; // id -> [links]，同一目标在两套目录里各有一条
        boxes.forEach(function (box) {
            box.querySelectorAll('a[href^="#"]').forEach(function (a) {
                var id = decodeURIComponent(a.getAttribute('href').slice(1));
                if (document.getElementById(id)) (map[id] = map[id] || []).push(a);
            });
        });
        var targets = Object.keys(map).map(function (id) { return document.getElementById(id); });
        if (!targets.length) return;
        var setActive = function (id) {
            document.querySelectorAll('.post-toc .active, .post-toc-mobile-body .active').forEach(function (el) { el.classList.remove('active'); });
            (map[id] || []).forEach(function (a) { a.classList.add('active'); });
        };
        // 自己接管点击：Turbo 对"同一个锚点第二次点击"（hash 不变）不响应，必须手动 scrollIntoView。
        // 滚动全程交给浏览器原生动画，不中途抢方向盘；只在"停稳"后测一次，偏差大才轻补一段（最多 2 次）。
        // 用户滚轮/触摸一动立即交还控制权；已到页底滚不动了就认了，不空转。
        var TOP = 84, act = null;
        function arm() {
            if (!act) return;
            clearTimeout(act.timer);
            act.timer = setTimeout(function () {
                var d = act.t.getBoundingClientRect().top - TOP;
                var maxS = document.documentElement.scrollHeight - innerHeight;
                if (Math.abs(d) < 8 || act.fixes >= 2 || (d > 0 && scrollY >= maxS - 2)) { act = null; return; }
                act.fixes++;
                scrollTo({ top: scrollY + d, behavior: 'smooth' });
                arm();
            }, 250);
        }
        function bail() { if (act) { clearTimeout(act.timer); act = null; } }
        function goTo(t) {
            bail();
            act = { t: t, fixes: 0 };
            t.scrollIntoView({ behavior: 'smooth' });
            arm();
        }
        addEventListener('scroll', function () { if (act) arm(); }, { passive: true });
        addEventListener('wheel', bail, { passive: true });
        addEventListener('touchstart', bail, { passive: true });
        boxes.forEach(function (box) {
            box.addEventListener('click', function (e) {
                var a = e.target.closest('a[href^="#"]');
                if (!a) return;
                var id = decodeURIComponent(a.getAttribute('href').slice(1));
                var t = document.getElementById(id);
                if (!t) return;
                e.preventDefault();
                goTo(t);
                history.replaceState(null, '', a.getAttribute('href'));
                setActive(id);
                var det = a.closest('details'); if (det) det.open = false; // 移动端跳转后收起
            });
        });
        var spy = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) { if (en.isIntersecting) setActive(en.target.id); });
        }, { rootMargin: '10% 0px -70% 0px' });
        targets.forEach(function (t) { spy.observe(t); });
        setActive(targets[0].id);
        window.__tocSpy = spy;
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', tocInit);
    else tocInit();
    document.addEventListener('turbo:load', tocInit);
})();
</script>
{{- end -}}
