{{- /* PaperMod 页面（文章/列表/标签等）补上首页同款字体，与 layouts/index.html 保持一致 */ -}}
{{- /* 国内镜像 fonts.loli.net；被墙时备用地址 https://fonts.googleapis.com/css2?... 同路径 */ -}}
<link rel="preconnect" href="https://fonts.loli.net" />
{{- /* 非阻塞加载字体：media=print 先不挡首屏渲染，onload 切回 all；无 JS 用 <noscript> 兜底 */ -}}
<link rel="preload" as="style" href="https://fonts.loli.net/css2?family=Space+Grotesk:wght@400,500,600&family=JetBrains+Mono:wght@400,500&display=swap" />
<link href="https://fonts.loli.net/css2?family=Space+Grotesk:wght@400,500,600&family=JetBrains+Mono:wght@400,500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<noscript><link href="https://fonts.loli.net/css2?family=Space+Grotesk:wght@400,500,600&family=JetBrains+Mono:wght@400,500&display=swap" rel="stylesheet" /></noscript>
{{ partialCached "js.html" (dict "path" "lib/turbo/turbo.umd.js" "defer" true) "turbo" }}
{{- /* RSS 自动发现：文章页无自带 feed，逐级回退到所属 section / 站点首页 feed */ -}}
{{- $feed := .OutputFormats.Get "rss" }}
{{- if not $feed }}{{ $feed = .Parent.OutputFormats.Get "rss" }}{{ end }}
{{- if not $feed }}{{ $feed = site.Home.OutputFormats.Get "rss" }}{{ end }}
{{- with $feed }}
<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ site.Title }}" />
{{- end }}
{{- /* 关键内联样式：主题 CSS 生效前（Turbo 换页/首帧）先约束主题模板里没写尺寸的 SVG，防巨大符号闪现 */ -}}
<style>
#top-link { visibility: hidden; }
#top-link:not(.hidden) { visibility: visible; }
#top-link svg { width: 24px; height: 24px; }
.breadcrumbs svg { width: 16px; height: 16px; }
#read-progress { position: fixed; top: 0; left: 0; z-index: 100; height: 3px; width: 0; background: #7a6849; }
</style>
{{- /* 阅读进度条：挂在 documentElement 上，Turbo 换 body 不丢；非文章页自动归零 */ -}}
<script>
(() => {
  const bar = document.createElement("div");
  bar.id = "read-progress";
  document.documentElement.appendChild(bar);
  const upd = () => {
    const max = document.documentElement.scrollHeight - innerHeight;
    const on = !!document.querySelector(".post-content");
    bar.style.width = (on && max > 0 ? Math.min(scrollY / max, 1) * 100 : 0) + "%";
  };
  addEventListener("scroll", upd, { passive: true });
  addEventListener("resize", upd);
  addEventListener("turbo:load", upd);
  upd();
})();
</script>
