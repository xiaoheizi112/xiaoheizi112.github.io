{{- /* 统一导航（PaperMod 页）：与手写页共用 nav_links / nav_actions。
       header 外壳只负责吸顶与玻璃底，内部结构与首页 .nav 完全一致。 */ -}}
{{- $h := hugo.Data.home -}}
<header class="header">
  <nav class="nav" id="nav" aria-label="主导航">
    <div class="nav-inner">
      <a href="{{ site.Home.RelPermalink }}" class="brand">
        <span class="brand-mark" aria-hidden="true">{{ $h.about.mark }}</span>
        <span class="brand-name">{{ $h.brand.cn }}<span class="en">{{ $h.brand.en }}</span></span>
      </a>
      <div class="nav-links">{{ partial "nav_links.html" . }}</div>
      {{ partial "nav_actions.html" . }}
    </div>
  </nav>
</header>
