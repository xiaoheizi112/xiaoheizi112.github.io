# 02 SKILLS 技能矩阵数据源（2026-11 R9：官方多色原图 + 三行插空滚动）
# src  = static/icons/ 下的官方原图（颜色一律不动，站主 2026-11-10 定「用图标最原始的颜色」）
# tint = 该图标自己的主色/亮色。R14（白底方牌）起牌面不再吃它——白底上染色压不出色相，
#        模板仍以 style="--si:…" 输出，留给以后要用它的交互层；当前 CSS 无消费者，别再按它调色。
# 取源：gilbarbara/logos（jsdelivr 原文件，带真 viewBox 与官方多色）；
#       dify/coze 用 Iconify thesvg-color 方形件；易语言取易语言官网 eyuyan.com 的站点图标
#       images/e.ico 的 48px 帧（红「易」印章），白底与灰地球已抠成透明（站主 2026-11-10 指定）。
note: "图标为各家官方原色，未做统一调色。悬停或点按看注脚，窄屏左右滑。"
