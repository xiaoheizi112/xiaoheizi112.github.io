# 首屏一句话概述：每条一件事 + 一个可验证的点，不写形容词
summary:
  - "独立完成 3 个 Qt / C++ 项目：人脸识别考勤系统（C/S + OpenCV + SQLite）、音乐播放器桌面前端、天气预报客户端。"
