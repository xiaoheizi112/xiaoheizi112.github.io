footer:
  line: "思多乱其志，行者皆披靡。"

# 07 文章板块（2026-11 新增）：正文一律来自 content/posts/*.md，这里只管首页卡文案位。
#   note —— 标题下的介绍词，留空（""）就不渲染那一行；空列表时本字段不显示（走待机面板）
#   list —— 首页卡最多露出几篇（其余去 /posts/ 看）
# 站主的长文案随后补：直接改 note，或在 content/posts/ 放 .md（front matter: title/date/description/tags）
posts:
  note: ""
  list: 4

