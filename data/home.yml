# ============================================================
# 首页内容配置 —— 改这里就够了，不用碰模板和 CSS
# ============================================================

brand:
  cn: "慢公子"
  en: "GONGZI"          # 品牌旁边的小字英文/拼音

hero:
  eyebrow: "个人主页 · FIELD NOTES"
  # 站龄起点：仓库真实诞生日（GitHub API created_at = 2026-09-22T00:41:46Z）。
  # 模板按此算「ONLINE DAY」，deck.js 每次访问用当前时间重算；改这里即换锚点。
  online_since: "2026-09-22"
  line1: "想过的，"
  line2: "写下来才算数。"   # 这一行会显示成强调色
  sub: >-
    记忆会偷偷改写过去，文字不会。所以这座小站慢慢搭、想起来才更新——
    不为给谁看，是给未来的自己留一个能回来翻翻的地方。
  cta_primary: "开始阅读"
  cta_secondary: "先听一首"

# 关于板块（2026-11-11 R3 改版：03 卡「人事档案」面板内容换血）：
#   profile —— 档案条目 name + note；note 走等宽小字右对齐，一条一行。
#              2026-11-11 站主令：旧读数（主职/技能栈/本站/旧座右铭）整表撤掉，换成昵称 /
#              一句话介绍 / 博客定位 / 新座右铭四条，文案由站主给定，别自行发挥。
#              排法也按站主定的语义顺序：昵称 → 一句话介绍 → 博客定位 → 座右铭，
#              人格测试作为附加读数垫尾；字色已统一白色，不再有 key 主读数之分。
#   quote/quote_by —— 原 STATEMENT 大字引言，2026-11-11 站主令撤出 03 面板；原文留档，
#                     当前模板不渲染，别再往回挂（要恢复先问站主）
#   底栏（READ FULL BIO / EST. / 条形码）与 /about/ 页已于 2026-11-11 站主令删除。
about:
  quote:
    - "张量翻涌，AI 不息。"
    - "快是模型的本能，慢是我的<span class=\"em\">选择</span>。"
  quote_by: "慢公子"
  profile:
    - name: "昵称"
      note: "慢公子"
    - name: "一句话介绍我"
      note: "自由散漫的创作者，偶尔做点小项目"
    - name: "博客定位"
      note: "日常兴趣分享"
    - name: "座右铭"
      note: "思多乱其志，行者皆披靡。"
    - name: "人格测试"
      note: "ESTJ · 边界 I/E · 偏内敛 · 温和型"

