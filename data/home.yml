# 关于板块。头像位显示一个汉字（mark），想换图片的话以后再说
about:
  mark: "慢"
  since: "EST. 2026 · 线上某处"
  paragraphs:
    - >-
      我是<span class="em">慢公子</span>。人如其名，干什么都慢，
      懒是主要驱动力。开这个站不是为了输出干货，是给自己找个地方堆放想法——
      省得散落在各个聊天窗口里过期。
    - >-
      这里没有「颠覆」「革命性」的口号。更新频率取决于我什么时候
      突然想说点什么，可能一周三篇，可能一年零篇。
    - >-
      相信<span class="em">能把复杂的事拆到每天能用的一块</span>，
      就已经赢了大部分空想。
  tags: ["摸鱼开发", "随笔", "自动化", "XXXTENTACION", "想一出是一出"]

