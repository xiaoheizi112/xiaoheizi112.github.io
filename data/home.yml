hero:
  eyebrow: "个人主页 · FIELD NOTES"
  line1: "慢慢写，"
  line2: "只写想起来的那一句。"   # 这一行会显示成强调色
  sub: >-
    懒是主要驱动力。这里堆放想法、代码残骸和一个 XXXTentacion 歌单。
