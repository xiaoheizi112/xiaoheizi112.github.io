  since: "EST. 2026 · 山间有炊烟"
  paragraphs:
    - >-
      <span class="em">慢</span>，是一种态度。
      <span class="em">公子</span>，是一种自嘲。
    - >-
      博客，是一块<span class="em">自留地</span>。
      种什么，什么时候种，看天，看心情，看你来不来。
  tags: ["笔记", "AI 编程", "自动化", "旅行随拍", "听歌"]

