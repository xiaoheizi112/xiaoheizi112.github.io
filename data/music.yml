# Music Playlist - 慢公子的小站
# mp3 在 static/music/，封面在 static/music/covers/（同名 .jpg，来自 iTunes/Deezer 官方封面）
# freq = 03 电台调谐面板的 FM 频道（升序对应 CH-01..09，刻度带 87.5–108.0）
# short = 频道列表窄列用的短标题（避免 CSS 截断断在难看的音节上；示波器/播放条仍用全名）
# 旧 XXXTENTACION 五首（sad/moonlight/everybody-dies/whoa/numb.mp3）已出 playlist，文件仍留在 static/music/，要找回把条目加回即可

- title: "Lose My Mind (feat. Doja Cat)"
  short: "Lose My Mind"
  artist: "Don Toliver & Doja Cat"
  freq: 88.4
  desc: "夜色里的循环，人声切片一圈圈把理智绕丢。"
  desc_en: "A night-drive loop - vocal chops circling your reason away."
  url: "music/lose-my-mind.mp3"
  cover: "music/covers/lose-my-mind.jpg"

- title: "Lost Memory"
