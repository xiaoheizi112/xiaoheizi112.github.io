# XXXTENTACION 五首；mp3 在 static/music/，封面 ?=粉色蝴蝶（Apple Music CDN）、17=蓝色（网易云）

- title: "SAD!"
  artist: "XXXTENTACION"
  desc: "他最出名的一首，旋律里裹着难过——那句没说完的，世界替他唱完了。"
  desc_en: "His most famous song, sadness folded into the melody - the line he never finished, the world sang out for him."
  url: "music/sad.mp3"
  cover: "music/covers/q.jpg"

- title: "moonlight"
  artist: "XXXTENTACION"
  desc: "几首里最轻快的一首，鼓点跳跃，像他也曾短暂忘掉过什么。"
  desc_en: "The lightest of the bunch, drums bouncing, as if for a moment he forgot something."
  url: "music/moonlight.mp3"
  cover: "music/covers/q.jpg"

- title: "Everybody Dies in Their Nightmares"
  artist: "XXXTENTACION"
  desc: "写失眠和噩梦的那一首，像贴着耳朵唱——他从不修饰自己。"
  desc_en: "The one about insomnia and nightmares, sung right against your ear - he never dressed himself up."
  url: "music/everybody-dies.mp3"
  cover: "music/covers/17.jpg"

- title: "whoa (mind in awe)"
  artist: "XXXTENTACION"
  desc: "只有 1 分 46 秒，给自己的精神状态，他只说了这一句。"
  desc_en: "Just 1 minute 46 seconds long - the only thing he said about the state of his mind."
  url: "music/whoa.mp3"
  cover: "music/covers/q.jpg"

- title: "NUMB"
  artist: "XXXTENTACION"
  desc: "讲名气带来的麻木，和他把自己裹起来的方式。"
