# 05 WORKS 作品屏数据 —— layouts/index.html 的 #c-works 卡读取，数组顺序 = 屏上顺序。
# 字段：name 项目名 · sub 一行中文简介 · tech 技术栈 · url 仓库地址
#       updated 更新年月（原样字符串）· photo hover 预览底图（static 直链）
#       ar 预览框宽高比（CSS aspect-ratio 值，缺省 16 / 10）
#       tall: true 竖屏截图（预览框改按高度定宽）· wire: true 无真实截图，保留全息线框浮层
#       shots 放映机灯箱原图（proj.js 经行上 data-shots 读取；README 正文截图，
#             存 static/images/works/，文件名尾号 = 数组位次；与 hover 底图同字节的直接复用现有文件）
