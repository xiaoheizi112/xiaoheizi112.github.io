<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="慢公子 准星">
  <!-- 站标（2026 年 11 月 jiejoe 风重构 P3）：黑底 + 荧光绿线框准星。
       对应站内 fx.js 的十字准星光标（.cur：横线、竖线、圆环），
       以及背景斜激光，把「取景与瞄准」当成站的符号。
       旧版是晴空蓝底加白色实心「慢」字，在黑底站里发灰，已弃用。
       可读性约束：16px（viewBox 64 的 0.25 倍）下主笔画要够 1px，
       所以描边统一 4.5（16px 下约 1.1px），中心实心点半径 5（2.5px），
       不用滤镜与渐变（小尺寸会糊，部分标签页渲染器也不支持 filter）。
       注意：XML 注释里不能出现连续两个减号，令牌名一律写成文字。 -->

  <!-- 底色取站点 void 令牌值 050607；圆角兼容浏览器标签的圆形裁切 -->
  <rect width="64" height="64" rx="14" fill="#050607"/>

  <!-- 两条极淡斜激光：16px 下读作背景纹理，不影响准星剪影 -->
  <g stroke="#3ae35c" stroke-width="1.6" opacity="0.16">
    <path d="M-6 46 22 -6"/>
    <path d="M40 70 68 18"/>
  </g>

  <!-- 准星主体：环加四向刻度（外端贴边、内端留缺口，小尺寸下最稳的十字剪影） -->
  <g fill="none" stroke="#3ae35c" stroke-width="4.5" stroke-linecap="round">
    <circle cx="32" cy="32" r="15.5"/>
    <path d="M32 5.5v8M32 50.5v8M5.5 32h8M50.5 32h8"/>
  </g>

  <!-- 中心实心点：acid 绿，16px 下仍是最先被认出的那一颗 -->
  <circle cx="32" cy="32" r="5" fill="#3ae35c"/>
</svg>
